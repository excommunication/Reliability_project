server.tomcat.threads.max=100
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=50

rest.client.connect-timeout=3000
rest.client.read-timeout=5000

resilience4j.ratelimiter.instances.limiter.limitForPeriod=10
resilience4j.ratelimiter.instances.limiter.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.limiter.timeoutDuration=0s

resilience4j.circuitbreaker.instances.circuit.sliding-window-type=TIME_BASED
resilience4j.circuitbreaker.instances.circuit.sliding-window-size=10
resilience4j.circuitbreaker.instances.circuit.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.circuit.record-exceptions=app.exceptions.WebExceptions.InternalErrorException
resilience4j.circuitbreaker.instances.circuit.register-health-indicator=true

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

resilience4j.retry.instances.retry-recommendations.max-attempts=3
resilience4j.retry.instances.retry-recommendations.wait-duration=500ms
resilience4j.retry.instances.retry-recommendations.enable-exponential-backoff=true
resilience4j.retry.instances.retry-recommendations.exponential-backoff-multiplier=2.0
resilience4j.retry.instances.retry-recommendations.retry-exceptions=app.exceptions.WebExceptions.InternalErrorException
resilience4j.retry.instances.retry-recommendations.ignore-exceptions=app.exceptions.WebExceptions.BadRequestException

resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.retry.retry-aspect-order=2

app.fallback.enabled=true

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=15m 


rest.client.base-uri-game=http://127.0.0.1:8081/api/v1/games
rest.client.base-uri-recommendations=http://127.0.0.1:8082/api/v1/recommendations